[project]
name = "credit-risk"
version = "0.1.0"
description = "PD scorecard, independent model validation and IFRS 9 expected credit loss on Lending Club data"
readme = "README.md"
authors = [
    { name = "Santiago Rueda" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi>=0.162.4",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
